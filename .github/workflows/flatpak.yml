name: Flatpak build

# Builds the Flatpak bundle from the current source tree. This is an
# experimental artifact, not a supported release download: host Steam/Proton
# process detection inside the sandbox is still gated.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11
      - name: Build Flatpak from source
        run: |
          flatpak-builder --user --repo=repo --force-clean build-flatpak \
            packaging/flatpak/io.github.nasira1991.SteamLibraryMover.yml
      - name: Export bundle
        run: |
          flatpak build-bundle repo SteamLibraryMover.flatpak \
            io.github.nasira1991.SteamLibraryMover
      - name: Lint metadata
        run: |
          sudo apt-get install -y appstream
          appstreamcli validate --no-net \
            resources/io.github.nasira1991.SteamLibraryMover.metainfo.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flatpak-experimental
          path: SteamLibraryMover.flatpak
          if-no-files-found: error
