name: Flatpak (manual, gated)

# Deliberately manual. Flatpak cannot reliably inspect host Steam/Proton
# processes until the host-spawn path is validated in a real sandbox.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11
      - name: Build Flatpak
        run: |
          flatpak-builder --repo=repo --force-clean build-flatpak \
            packaging/flatpak/io.github.nasira1991.SteamLibraryMover.yml
      - name: Export bundle
        run: |
          flatpak build-bundle repo SteamLibraryMover.flatpak \
            io.github.nasira1991.SteamLibraryMover
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: SteamLibraryMover.flatpak
