name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ libgl1-mesa-dev fuse libfuse2
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Install pinned packaging tools
        run: |
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          cat > packaging-tools.sha256 <<'EOF'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          EOF
          sha256sum -c packaging-tools.sha256
          chmod +x linuxdeploy linuxdeploy-plugin-qt appimagetool
          mkdir -p "$HOME/.local/bin"
          mv linuxdeploy linuxdeploy-plugin-qt appimagetool "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          EXTRA_QT_MODULES: svg
          APPIMAGE_EXTRACT_AND_RUN: '1' 
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          PATH="$QT_ROOT_DIR/bin:$PATH" packaging/appimage/build-appimage.sh
      - name: Smoke-check AppImage
        run: |
          appimage=$(find . -maxdepth 1 -name 'Steam_Library_Mover*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage
          path: Steam_Library_Mover*.AppImage
          if-no-files-found: error

  arch-package:
    name: Arch package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Install packaging dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja qt6-base qt6-svg git namcap pacman-contrib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build package
        run: |
          version="${GITHUB_REF_NAME#v}"
          useradd --create-home builder
          chown -R builder:builder .
          su builder -c '
            set -eu
            cd "$1"
            sed -i "s/^pkgver=.*/pkgver=$2/" PKGBUILD
            updpkgsums
            makepkg --nodeps --force
          ' _ "$PWD/packaging/aur" "$version"
          package=$(find packaging/aur -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          test -n "$package"
          namcap "$package" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-package
          path: packaging/aur/*.pkg.tar.zst
          if-no-files-found: error

  source:
    name: Source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="steam-library-mover-${version}/" \
            -o "steam-library-mover-${version}.tar.gz" HEAD
          sha256sum "steam-library-mover-${version}.tar.gz" > "steam-library-mover-${version}.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: |
            steam-library-mover-*.tar.gz
            steam-library-mover-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [appimage, arch-package, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name '*.sha256' -printf '%f\n' \
            | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Steam Library Mover ${{ github.ref_name }}
          prerelease: false
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/*.AppImage
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/SHA256SUMS
